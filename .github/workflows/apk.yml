name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Signing config
        env:
          STORE: ${{ secrets.STORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE" ]; then
            echo "$STORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            # no secrets configured: generate a throwaway key so the APK is still installable
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias ci -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass cipassword -keypass cipassword -dname "CN=Car AirPlay CI"
            STORE_PASSWORD=cipassword KEY_ALIAS=ci KEY_PASSWORD=cipassword
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > local.properties

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk CarAirPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarAirPlay-apk
          path: CarAirPlay.apk

  # Publishes a Release for each tested APK committed as release/CarAirPlay-<version>.apk.
  # The tag v<version> is created by this job, so nobody has to push tags.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find unreleased APK
        id: pick
        run: |
          shopt -s nullglob
          for f in release/CarAirPlay-*.apk; do
            v=$(basename "$f" .apk); v=${v#CarAirPlay-}
            if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already released"; continue; fi
            mkdir -p out; cp "$f" out/
            [ -f "$f.sha256" ] && cp "$f.sha256" out/
            if [ -f "release/notes-$v.md" ]; then cp "release/notes-$v.md" notes.md; else echo "CarAirPlay v$v" > notes.md; fi
            echo "version=$v" >> "$GITHUB_OUTPUT"
            break
          done
      - if: steps.pick.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pick.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CarAirPlay v${{ steps.pick.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: out/*

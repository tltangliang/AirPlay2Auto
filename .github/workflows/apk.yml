name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Signing config
        env:
          STORE: ${{ secrets.STORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$STORE" ]; then
            echo "$STORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            # no secrets configured: generate a throwaway key so the APK is still installable
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias ci -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass cipassword -keypass cipassword -dname "CN=Car AirPlay CI"
            STORE_PASSWORD=cipassword KEY_ALIAS=ci KEY_PASSWORD=cipassword
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > local.properties

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk CarAirPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarAirPlay-apk
          path: CarAirPlay.apk

  # Tag v1.2.3 publishes the tested, signed APK committed at release/CarAirPlay-1.2.3.apk
  # (falls back to the CI build when no such file exists).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CarAirPlay-apk
          path: ci
      - name: Pick APK
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          if [ -f "release/CarAirPlay-$v.apk" ]; then
            cp "release/CarAirPlay-$v.apk" out/
            [ -f "release/CarAirPlay-$v.apk.sha256" ] && cp "release/CarAirPlay-$v.apk.sha256" out/
          else
            cp ci/CarAirPlay.apk "out/CarAirPlay-$v.apk"
          fi
          ls -la out
          if [ -f "release/notes-$v.md" ]; then cp "release/notes-$v.md" notes.md; else echo "CarAirPlay $GITHUB_REF_NAME" > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: CarAirPlay ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
